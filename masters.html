<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeGuard | Masters</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="masters.css">
</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <!-- Same sidebar used in dashboard.html -->
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Page Title -->
        <section class="hero">
            <h1>Verified Masters</h1>
            <p>
                Discover professional traders with verified performance and request to follow them.
            </p>
        </section>

        <!-- Filters -->
        <section class="filters">

            <input
                type="text"
                id="searchBox"
                placeholder="Search Master ID">

            <select id="sortBy">
                <option value="growth">Highest Growth</option>
                <option value="days">Longest Trading Days</option>
                <option value="drawdown">Lowest Drawdown</option>
                <option value="followers">Most Followers</option>
            </select>

            <input
                type="number"
                id="minDays"
                placeholder="Minimum Trading Days">

            <input
                type="number"
                id="maxDD"
                placeholder="Maximum Drawdown %">

            <input
                type="number"
                id="minGrowth"
                placeholder="Minimum Growth %">

            <button id="applyFilters">
                Apply Filters
            </button>

        </section>

        <!-- Master Cards -->
        <section
            class="masterContainer"
            id="masterContainer">
        </section>

    </main>

</div>

<script src="sidebar.js"></script>
<script src="masters.js"></script>

</body>
</html>
